[project]
name = "memory-agent"
version = "0.1.0"
description = "An agent with a tool to save long-term memory."
authors = [
    { name = "William Fu-Hinthorn", email = "13333726+hinthornw@users.noreply.github.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.12"

dependencies = [
    # LangGraph
    "langgraph==1.2.14",

    # LLM / LangChain
    "langchain==1.4.4",
    "langchain-core==1.6.9",
    "langchain-openai==1.7.0",
    "langchain-anthropic==1.7.5",
    "langchain-deepseek==1.1.1",

    # Environment
    "python-dotenv==1.2.4",

    # LangGraph SDK
    "langgraph-sdk==0.4.6",

    # PostgreSQL / Long-term Memory / RAG
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary]==3.3.5",
]


[project.optional-dependencies]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.4",
]


[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "langgraph-cli[inmem]==0.4.31",
    "mypy>=2.3.1",
    "pytest>=9.0.3",
    "ruff>=0.16.4",
]


[build-system]
requires = [
    "setuptools>=84.0.0",
    "wheel",
]
build-backend = "setuptools.build_meta"


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = ["memory_agent*"]


[tool.setuptools.package-data]
"*" = ["py.typed"]


[tool.ruff]
lint.select = [
    "E",
    "F",
    "I",
    "D",
    "D401",
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]
include = [
    "*.py",
    "*.pyi",
    "*.ipynb",
]


[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
"ntbk/*" = ["D", "UP", "T201"]


[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.mypy]
ignore_errors = true