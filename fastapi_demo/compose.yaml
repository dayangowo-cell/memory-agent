services:

  api:
    build: .
    container_name: fastapi-compose

    ports:
      - "8003:8000"

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: memory_agent_db
      DB_USER: postgres
      DB_PASSWORD: demo123

    depends_on:
      - db


  db:
    image: pgvector/pgvector:pg16
    container_name: postgres-compose

    environment:
      POSTGRES_PASSWORD: demo123
      POSTGRES_DB: demo_db

    ports:
      - "5433:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data


volumes:

  pgdata:
    name: memory-agent-pgdata